<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" contentStyleType="text/css" height="1003.33px" preserveAspectRatio="none" style="width:1260px;height:1072px;background:#FFFFFF;" version="1.1" viewBox="0.00 0.00 1260.00 1002.42" width="1260.4167px" zoomAndPan="magnify"><ns0:defs /><ns0:g><ns0:ellipse cx="634.611" cy="41.6667" fill="#000000" rx="20.8333" ry="20.8333" style="stroke:#222222;stroke-width:2.0833333333333335;" /><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="481.134" x="394.044" y="104.1667" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="439.4674" x="414.8773" y="146.4956">Màn hình Giám sát đối soát vé của Quản lý</ns0:text><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="599.4548" x="334.8836" y="213.8519" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="557.7881" x="355.717" y="256.1808">Tải nhật ký quét vé thời gian thực của các phòng chiếu</ns0:text><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="485.0616" x="392.0802" y="323.5372" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="443.395" x="412.9135" y="365.8661">Hệ thống chạy thuật toán phát hiện gian lận</ns0:text><ns0:polygon fill="#FCF0CC" points="472.8907,433.2225,796.3313,433.2225,821.3313,458.2225,796.3313,483.2225,472.8907,483.2225,447.8907,458.2225,472.8907,433.2225" style="stroke:#B85450;stroke-width:2.5;" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="323.4406" x="472.8907" y="466.5421">Phát hiện dấu hiệu bất thường?</ns0:text><ns0:text fill="#000000" font-family="Arial" font-size="20.8333" lengthAdjust="spacing" textLength="116.9739" x="330.9168" y="453.8076">[Có gian lận]</ns0:text><ns0:text fill="#000000" font-family="Arial" font-size="20.8333" lengthAdjust="spacing" textLength="128.3773" x="821.3313" y="453.8076">[Bình thường]</ns0:text><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="571.6482" x="34.3079" y="504.0558" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="529.9815" x="55.1412" y="546.3847">Hiển thị cảnh báo vé giả mạo hoặc vé quét trùng lặp</ns0:text><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="594.4305" x="22.9167" y="613.741" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="552.7639" x="43.75" y="656.0699">Trích xuất hình ảnh camera tại cửa soát vé tương ứng</ns0:text><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="555.1432" x="42.5603" y="723.4263" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="513.4766" x="63.3937" y="765.7552">Lập biên bản sự vụ và khóa quyền truy cập của vé</ns0:text><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="421.403" x="109.4304" y="833.1116" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="379.7363" x="130.2638" y="875.4405">Thông báo cho bộ phận an ninh xử lý</ns0:text><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="580.1524" x="659.0139" y="504.0558" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="538.4857" x="679.8472" y="546.3847">Ghi nhận đối soát khớp 100% dữ liệu vé và số người</ns0:text><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="553.9235" x="672.1283" y="613.741" /><ns0: