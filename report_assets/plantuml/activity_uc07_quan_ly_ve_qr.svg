<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" contentStyleType="text/css" height="1232.50px" preserveAspectRatio="none" style="width:1679px;height:1302px;background:#FFFFFF;" version="1.1" viewBox="0.00 0.00 1679.00 1232.42" width="1679.1667px" zoomAndPan="magnify"><ns0:defs /><ns0:g><ns0:ellipse cx="616.7521" cy="41.6667" fill="#000000" rx="20.8333" ry="20.8333" style="stroke:#222222;stroke-width:2.0833333333333335;" /><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="413.4583" x="410.023" y="104.1667" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="371.7916" x="430.8563" y="146.4956">Mở giao diện Lịch sử đặt vé cá nhân</ns0:text><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="487.557" x="372.9736" y="213.8519" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="445.8903" x="393.807" y="256.1808">Hiển thị danh sách vé đã mua của tài khoản</ns0:text><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="512.8011" x="360.3516" y="323.5372" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="471.1344" x="381.1849" y="365.8661">Khách hàng chọn một đơn vé trong danh sách</ns0:text><ns0:polygon fill="#FCF0CC" points="505.9062,433.2225,727.5981,433.2225,752.5981,458.2225,727.5981,483.2225,505.9062,483.2225,480.9062,458.2225,505.9062,433.2225" style="stroke:#B85450;stroke-width:2.5;" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="221.6919" x="505.9062" y="466.5421">Chọn tác vụ xử lý vé?</ns0:text><ns0:text fill="#000000" font-family="Arial" font-size="20.8333" lengthAdjust="spacing" textLength="181.7627" x="299.1435" y="453.8076">[Xem và Tải vé QR]</ns0:text><ns0:text fill="#000000" font-family="Arial" font-size="20.8333" lengthAdjust="spacing" textLength="119.0389" x="752.5981" y="453.8076">[Hủy đơn vé]</ns0:text><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="539.7461" x="22.9167" y="504.0558" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="498.0794" x="43.75" y="546.3847">Hiển thị chi tiết vé, mã ghế và hình ảnh QR Code</ns0:text><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="415.9648" x="84.8073" y="613.741" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="374.2981" x="105.6407" y="656.0699">Nhấn nút "Tải vé QR / Lưu hình ảnh"</ns0:text><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="385.7076" x="99.9359" y="723.4263" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="344.0409" x="120.7692" y="765.7552">Lưu file ảnh vé về thiết bị cá nhân</ns0:text><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="672.7702" x="604.3294" y="504.0558" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="631.1035" x="625.1628" y="546.3847">Kiểm tra điều kiện thời gian hủy (trước giờ chiếu tối thiểu 60p)</ns0:text><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="398.3744" x="741.5273" y="613.741" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="356.7078" x="762.3606" y="656.0699">Chọn lý do hủy vé và xác nhận hủy</ns0:text><ns0:polygon fill="#FCF0CC" points="863.1358,838.0096,1018.2933,838.0096,1043.2933,863.0096,1018.2933,888.0096,863.1358,888.0096,838.1358,863.0096,863.1358,838.0096" style="stroke:#B85450;stroke-width:2.5;" /><ns0:text fill="#000000" font-family="Arial" font-size="20.8333" lengthAdjust="spacing" textLength="73.8729" x="949.0479" y="907.5511">[Hợp lệ]</ns0:text><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="155.1575" x="863.1358" y="871.3292">Hợp lệ hủy vé?</ns0:text><ns0:text fill="#000000" font-family="Arial" font-size="20.8333" lengthAdjust="spacing" textLength="136.4441" x="1043.2933" y="858.5948">[Không hợp lệ]</ns0:text><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="468.1875" x="1189.9017" y="707.491" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="420.1538" x="1217.1021" y="749.8199">Vi phạm thời gian hủy vé / Không thể hủy</ns0:text><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="568.7948" x="656.3171" y="952.3427" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="527.1281" x="677.1505" y="994.6716">Đổi trạng thái vé sang "Đã hủy" và nhả ghế về trống</ns0:text><ns0:rect fill="#FCF0CC" height="68.0186" rx="12.5" ry="12.5" style="stroke:#B85450;stroke-width:2.5;" width="496.6207" x="692.4042" y="1062.028" /><ns0:text fill="#000000" font-family="Arial" font-size="22.9167" lengthAdjust="spacing" textLength="454.954" x="713.2375" y="1104.3569">Gửi yêu cầu hoàn tiền tự động theo quy định</ns0:text><ns0:ellipse cx="616.7521" cy="1167.5466" fill="none" rx="22.9167" ry="22.9167" style="stroke:#222222;stroke-width:2.0833333333333335;" /><ns0:ellipse cx="616.7521" cy="1167.5466" fill="#222222" rx="12.5" ry="12.5" style="stroke:#222222;stroke-width:2.0833333333333335;" /><ns0:line style="stroke:#333333;stroke-width:2.5;" x1="616.7521" x2="616.7521" y1="62.5" y2="104.1667" /><ns0:polygon fill="#333333" points="608.4188,83.3333,616.7521,104.1667,625.0854,83.3333,616.7521,91.6667" sty